<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="design_doc_mode" content="canvas">
<title>Luera Masaüstü — Ayarlar → WhatsApp v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800;900&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
[data-theme="light"]{--desk:#E4DACA;--bg:#FAF7F3;--side:#F3EDE3;--s2:#F0E9DF;--s3:#E9E1D5;--card:#FFFDFB;--tx:#0E0E0E;--tx2:rgba(14,14,14,.68);--tx3:rgba(14,14,14,.46);--bd:rgba(14,14,14,.10);--bd2:rgba(14,14,14,.18);--ifill:#FFFDFB;--ibd:rgba(14,14,14,.22);--hov:rgba(14,14,14,.045);--off:rgba(14,14,14,.10);--knob:#FFFFFF;--or:#FF5A1F;--btx:#0E0E0E;--rd:#C94040;--rdt:#B83636;--rdbd:rgba(201,64,64,.38);--rdz:rgba(201,64,64,.035);--ebg:#FAEAE8;--am:#B87A00;--amt:#8A5A00;--wbg:#FBF1DC;--wbd:rgba(184,122,0,.42);--gr:#2D8F32;--grt:#23702A;--ov:rgba(34,24,12,.38);--sh:0 18px 48px rgba(52,36,14,.16),0 2px 6px rgba(52,36,14,.06);--skel:rgba(14,14,14,.07);--chat:#EFEAE2;--bub:#D9FDD3;--bubtx:#111B21;--bubt:#667781;--inv:#0E0E0E;--invtx:#FAF7F3}
[data-theme="dark"]{--desk:#0B0906;--bg:#111009;--side:#191610;--s2:#191610;--s3:#231E18;--card:#191610;--tx:#F3EDE3;--tx2:rgba(243,237,227,.68);--tx3:rgba(243,237,227,.46);--bd:rgba(243,237,227,.10);--bd2:rgba(243,237,227,.18);--ifill:rgba(243,237,227,.04);--ibd:rgba(243,237,227,.22);--hov:rgba(243,237,227,.05);--off:rgba(243,237,227,.12);--knob:#F3EDE3;--or:#FF5A1F;--btx:#0E0E0E;--rd:#E07272;--rdt:#EE8C8C;--rdbd:rgba(224,114,114,.42);--rdz:rgba(224,114,114,.05);--ebg:#3A1414;--am:#D9A43B;--amt:#E8B85A;--wbg:#2E2410;--wbd:rgba(217,164,59,.5);--gr:#5FBF64;--grt:#76CF7B;--ov:rgba(0,0,0,.62);--sh:0 18px 48px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.3);--skel:rgba(243,237,227,.08);--chat:#0B141A;--bub:#005C4B;--bubtx:#E9EDEF;--bubt:rgba(233,237,239,.62);--inv:#F3EDE3;--invtx:#111009}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--desk);color:var(--tx);font-family:'Hanken Grotesk',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
input,textarea{font:inherit;color:inherit;background:transparent;border:0;outline:0;min-width:0}
input::placeholder{color:var(--tx3)}
a{color:var(--tx);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px;cursor:pointer}
a:hover{color:var(--tx);text-decoration-color:var(--or)}
:focus-visible{outline:2px solid var(--or);outline-offset:2px}
ul,ol{list-style:none}
.mono{font-family:'JetBrains Mono',monospace}
.ic{flex:none;display:block}
@keyframes wd{from{opacity:.3}to{opacity:1}}
@keyframes fi{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@keyframes bar{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes dlg{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* doc */
.doc{min-width:max-content;padding:64px 64px 220px}
.tbtn{position:fixed;top:18px;right:18px;z-index:100;display:flex;align-items:center;gap:10px;height:42px;padding:0 16px 0 12px;border-radius:999px;background:var(--card);border:1px solid var(--bd2);box-shadow:var(--sh);font-size:14px;font-weight:800}
.tbtn i{width:10px;height:10px;border-radius:50%;background:var(--or)}
.dh{max-width:1440px;display:flex;flex-direction:column;gap:28px;padding-bottom:40px;border-bottom:1px solid var(--bd2)}
.dtop{display:flex;justify-content:space-between;align-items:flex-end;gap:24px}
.logo{display:inline-flex;align-items:flex-end;font-weight:900;letter-spacing:-.05em;line-height:.82;font-size:40px}
.logo span{display:inline-flex;align-items:center;font-size:12px;height:20px;padding:0 8px;margin-left:5px;margin-bottom:-3px;border-radius:999px;background:var(--or);color:#fff;font-weight:800;letter-spacing:-.01em;line-height:1}
.dmeta{font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.8;color:var(--tx2);text-align:right}
.dh h1{font-size:44px;font-weight:800;letter-spacing:-.035em;line-height:1.04}
.dlead{font-size:16px;font-weight:500;line-height:1.6;color:var(--tx2);max-width:880px;text-wrap:pretty}
.dcols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:36px}
.dcol{display:flex;flex-direction:column;gap:10px;font-size:14px;line-height:1.55}
.dcol .k{font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--tx2)}
.dcol p,.dcol li{text-wrap:pretty}.dcol li{display:flex;gap:10px}.dcol li::before{content:'';flex:none;width:12px;height:1px;background:var(--or);margin-top:10px}
.dcol .m{color:var(--tx2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips a{font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:600;text-decoration:none;padding:5px 10px;border-radius:8px;border:1px solid var(--bd2);background:var(--bg)}
.row{margin-top:96px;scroll-margin-top:24px}
.rh{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--bd2);max-width:1440px}
.code{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:600;padding:4px 10px;border-radius:8px;background:var(--tx);color:var(--desk)}
.rh h2{font-size:26px;font-weight:800;letter-spacing:-.02em}
.frs{display:flex;flex-wrap:wrap;gap:40px;align-items:flex-start;margin-top:26px;max-width:4400px}
.fw{display:flex;flex-direction:column;gap:10px;flex:none}
.flab{font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--tx2)}
.rmeta{display:flex;flex-direction:column;gap:8px;max-width:1100px;margin-top:22px}
.when{font-size:15px;font-weight:700;line-height:1.5}.when span{font-weight:500;color:var(--tx2)}
.notes{display:flex;flex-direction:column;gap:7px}
.notes li{display:flex;gap:12px;font-size:14.5px;font-weight:500;line-height:1.5;color:var(--tx2);text-wrap:pretty}
.notes li::before{content:'';flex:none;width:14px;height:1px;background:var(--or);margin-top:11px}
.notes li.mo{font-family:'JetBrains Mono',monospace;font-size:12.5px}.notes li.mo::before{background:var(--bd2)}
.xtab{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 24px;max-width:900px;margin-top:6px;border-top:1px solid var(--bd)}
.xtab>*{padding:10px 0;border-bottom:1px solid var(--bd);font-size:14.5px;line-height:1.45}.xtab b{font-weight:700}.xtab span{color:var(--tx2)}

/* frame + chrome */
.fr{position:relative;overflow:hidden;border-radius:14px;border:1px solid var(--bd2);background:var(--bg);color:var(--tx);display:flex}
.rail{width:76px;flex:none;background:var(--side);border-right:1px solid var(--bd);display:flex;flex-direction:column;align-items:center}
.rtop{position:relative;width:100%;height:88px;flex:none;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--bd)}
.lmark{position:relative;font-weight:900;font-size:34px;letter-spacing:-.05em;line-height:1}.lmark i{position:absolute;right:-8px;bottom:3px;width:7px;height:7px;border-radius:50%;background:var(--or)}
.rexp{position:absolute;right:-14px;top:30px;width:28px;height:28px;border-radius:50%;background:var(--bg);border:1px solid var(--bd2);display:flex;align-items:center;justify-content:center;color:var(--tx2);z-index:3}
.ricons{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:22px}
.ri{position:relative;width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--tx2)}
.ri.on{background:var(--card);border:1px solid var(--bd2);color:var(--or)}
.rbadge{position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--or)}
.rdiv{width:32px;height:1px;background:var(--bd);margin:6px 0}
.rbot{display:flex;flex-direction:column;align-items:center;gap:18px;padding:16px 0 20px;width:100%}
.rbot .av{border-top:0}
.av{width:44px;height:44px;border-radius:50%;background:var(--inv);color:var(--invtx);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px}
.snav{flex:none;border-right:1px solid var(--bd);display:flex;flex-direction:column;gap:14px;padding:0 14px 24px;overflow:hidden}
.snh{height:88px;flex:none;display:flex;align-items:center;padding:0 8px;font-size:26px;font-weight:800;letter-spacing:-.025em}
.sbox{height:46px;flex:none;display:flex;align-items:center;gap:10px;padding:0 10px 0 14px;border-radius:12px;background:var(--ifill);border:1px solid var(--ibd);color:var(--tx2);font-size:15px;font-weight:500}
.sbox span{flex:1}
kbd{font-family:'JetBrains Mono',monospace;font-size:12px;padding:1px 7px;border-radius:6px;border:1px solid var(--bd2);color:var(--tx2)}
.si{position:relative;display:flex;align-items:center;justify-content:space-between;height:44px;padding:0 10px 0 14px;border-radius:10px;font-size:15.5px;font-weight:600;color:var(--tx2);text-decoration:none;flex:none}
.si .ic{color:var(--tx3)}
.si.on{background:var(--s3);color:var(--tx);font-weight:800}.si.on .ic{color:var(--tx)}
.si.on::before{content:'';position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:2px;background:var(--or)}
.sg{flex:none;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:8px 6px;display:flex;flex-direction:column}
.sgh{display:flex;align-items:center;gap:9px;padding:10px 12px 8px;font-size:11.5px;font-weight:800;letter-spacing:.12em}
.sgh i{width:6px;height:6px;border-radius:50%;background:var(--or)}
.sgh .ic{margin-left:auto;color:var(--tx3)}
.mtop{flex:none;display:flex;align-items:center;gap:12px;padding:18px 28px;border-bottom:1px solid var(--bd)}
.mtop .t{font-size:22px;font-weight:800;letter-spacing:-.02em}.mtop .s{color:var(--tx3)}
.msel{height:44px;padding:0 12px 0 14px;border:1px solid var(--ibd);border-radius:12px;background:var(--ifill);display:flex;gap:10px;align-items:center;font-size:15.5px;font-weight:700}
.main{flex:1;min-width:0;position:relative;display:flex;flex-direction:column}
.scroll{flex:1;min-height:0;overflow:auto;scroll-behavior:smooth}
.fr.auto .scroll{overflow:visible}
.wa{container-type:inline-size}
.wi{max-width:1010px;padding:44px 52px 150px}

/* content */
.ph{display:flex;flex-direction:column;gap:8px}
.ph h1{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.ph p{font-size:16px;font-weight:500;line-height:1.5;color:var(--tx2);text-wrap:pretty}
.gl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:24px;border:1px solid var(--bd2);border-radius:18px;background:var(--card);overflow:hidden}
.gc{display:flex;flex-direction:column;gap:7px;padding:18px 20px 18px;text-decoration:none;border-left:1px solid var(--bd);min-width:0}
.gc:first-child{border-left:0}.gc:hover{background:var(--hov)}
.gq{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11.5px;font-weight:800;letter-spacing:.1em;color:var(--tx2)}
.gq .ic{color:var(--tx3)}
.ga{display:flex;align-items:center;gap:8px;font-size:17.5px;font-weight:800;letter-spacing:-.01em;line-height:1.25}
.ga.rdw{color:var(--rdt)}
.gs{font-size:14px;line-height:1.4;color:var(--tx2);text-wrap:pretty}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.dot.gr{background:var(--gr)}.dot.am{background:var(--am)}.dot.rd{background:var(--rd)}.dot.or{background:var(--or)}.dot.un{border:1.5px dashed var(--tx2)}
.sec{margin-top:56px;display:flex;flex-direction:column;gap:18px}
.sh{display:flex;flex-direction:column;gap:6px}
.shr{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.sh h2{font-size:22px;font-weight:800;letter-spacing:-.02em}
.sh p{font-size:15px;line-height:1.5;color:var(--tx2);max-width:640px;text-wrap:pretty}
.card{border:1px solid var(--bd2);border-radius:18px;background:var(--card);padding:22px 24px;display:flex;flex-direction:column;gap:20px}
.card.rdc{border-color:var(--rdbd)}
.wal{width:42px;height:42px;border-radius:12px;background:#25D366;color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.ch{display:flex;align-items:center;gap:14px}
.cst{flex:1;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:17px;font-weight:800}
.cst>span:not(.dot):not(.wdots){font-size:15px;font-weight:500;color:var(--tx2)}
.cst.rdw{color:var(--rdt)}
.wdots{display:inline-flex;gap:4px;margin-left:2px}.wdots i{width:6px;height:6px;border-radius:50%;background:currentColor;animation:wd 1.2s ease-in-out infinite alternate}.wdots i:nth-child(2){animation-delay:.2s}.wdots i:nth-child(3){animation-delay:.4s}
.btn{height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--bd2);background:var(--card);font-size:15px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;flex:none;white-space:nowrap}
.btn:hover{background:var(--hov)}
.btn.pri{background:var(--or);border-color:var(--or);color:var(--btx);font-weight:800}
.btn.inv{background:var(--inv);border-color:var(--inv);color:var(--invtx);font-weight:800}
.btn.rdb{border-color:var(--rdbd);color:var(--rdt);background:transparent}
.btn.ghost{border-color:transparent;background:transparent;color:var(--tx2)}.btn.ghost:hover{color:var(--tx);background:var(--hov)}
.btn.sm{height:36px;padding:0 12px;border-radius:10px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:default}
.cg{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:32px}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.eb{font-size:13.5px;font-weight:700;color:var(--tx2)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--bd);border-bottom:1px solid var(--bd)}
.stats>div{display:flex;flex-direction:column;gap:4px;padding:12px 0 12px 16px;border-left:1px solid var(--bd)}
.stats>div:first-child{padding-left:0;border-left:0}
.stats b{font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:600}
.stats span{font-size:14px;color:var(--tx2)}
.note{font-size:13.5px;line-height:1.5;color:var(--tx2);text-wrap:pretty}.note b{color:var(--tx)}
.zero{font-size:15px;font-weight:600;padding:14px 0;border-top:1px solid var(--bd);border-bottom:1px solid var(--bd)}
.lerr{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--wbg);border:1px solid var(--wbd);font-size:14.5px;line-height:1.45}
.lerr>.ic{color:var(--am);margin-top:1px}
.lerr .lc{flex:1;display:flex;flex-direction:column;gap:2px}.lerr .lc span{color:var(--tx2)}
.lerr .btn{align-self:center;background:var(--card)}
.lb{font-size:15px;font-weight:700}.lb span{font-weight:500;color:var(--tx2)}
.fld{height:46px;display:flex;align-items:center;gap:8px;padding:0 14px;border-radius:12px;background:var(--ifill);border:1px solid var(--ibd);font-size:16px;font-weight:600;min-width:0}
.fld input{flex:1;height:100%;font-weight:600}
input.fld{width:100%}
.fld.ph{color:var(--tx3);font-weight:500}
.fld.nf span{font-size:14px;font-weight:600;color:var(--tx2)}
.fld.ta{height:auto;min-height:66px;align-items:flex-start;padding:11px 14px;font-weight:500;line-height:1.45}
.trow{display:flex;gap:8px;align-items:center}
.trow .fld{flex:1;max-width:320px}
.res{display:flex;gap:8px;align-items:center;font-size:14.5px;font-weight:800}.res span{font-weight:500;color:var(--tx2)}
.res.ok .ic{color:var(--grt)}.res.no .ic{color:var(--am)}
.intro{display:flex;flex-direction:column;gap:8px;max-width:640px}
.intro h3,.qrs h3{font-size:19px;font-weight:800;letter-spacing:-.015em}
.intro p,.lead2{font-size:15.5px;line-height:1.55;color:var(--tx2);text-wrap:pretty;max-width:640px}
.acts{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.qrg{display:grid;grid-template-columns:220px minmax(0,1fr);gap:28px;align-items:start}
.qrbox{width:220px;height:220px;border-radius:14px;border:1px solid var(--bd2);background:repeating-linear-gradient(135deg,rgba(14,14,14,.12) 0 1px,#FFFFFF 1px 8px);display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:12px;color:#55524E}
.qrs{display:flex;flex-direction:column;gap:14px}
.qrs ol{display:flex;flex-direction:column;gap:8px;counter-reset:q}
.qrs li{display:flex;gap:10px;font-size:15px;line-height:1.45;color:var(--tx2)}.qrs li b{color:var(--tx)}
.qrs li::before{counter-increment:q;content:counter(q);flex:none;width:22px;height:22px;border-radius:50%;background:var(--s3);color:var(--tx);font-size:12.5px;font-weight:800;display:flex;align-items:center;justify-content:center}
.cd{display:flex;flex-direction:column;gap:8px;font-size:15px;font-weight:700;max-width:320px}
.trk{height:4px;border-radius:2px;background:var(--off);overflow:hidden}.trk i{display:block;height:100%;background:var(--tx);transform-origin:left;transition:transform 1s linear}
.lost{display:flex;flex-direction:column;gap:10px;padding:14px 16px;border-radius:12px;background:var(--rdz);border:1px solid var(--rdbd)}
.lost ul{display:flex;flex-wrap:wrap;gap:8px 22px}.lost li{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700}.lost li i{width:7px;height:7px;border-radius:50%;background:var(--rd)}
.sk{display:block;border-radius:8px;background:var(--skel)}
.sks>div{gap:8px}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.opt{display:flex;flex-direction:column;gap:8px;padding:18px;border-radius:16px;border:1px solid var(--bd2);background:var(--card)}
.opt:hover{border-color:var(--tx3)}
.opt[aria-checked="true"]{border:2px solid var(--tx);padding:17px}
.ot{display:flex;align-items:center;gap:10px;font-size:16.5px;font-weight:800}
.od{font-size:14px;line-height:1.45;color:var(--tx2);text-wrap:pretty}
.rad{width:22px;height:22px;border-radius:50%;border:1.6px solid var(--bd2);flex:none;display:flex;align-items:center;justify-content:center;background:var(--ifill)}
[aria-checked="true"]>.rad,[aria-checked="true"]>.ot>.rad{border:2px solid var(--tx)}
[aria-checked="true"]>.rad::after,[aria-checked="true"]>.ot>.rad::after{content:'';width:10px;height:10px;border-radius:50%;background:var(--tx)}
.sub{display:flex;flex-direction:column;gap:12px;padding-top:24px;margin-top:6px;border-top:1px solid var(--bd)}
.sub h3{font-size:17px;font-weight:800;letter-spacing:-.01em}
.why{display:flex;gap:9px;align-items:flex-start;font-size:15px;font-weight:600;line-height:1.45}.why .ic{color:var(--tx2);margin-top:2px}
.alist{display:flex;flex-direction:column;border-top:1px solid var(--bd)}
.arow{display:grid;grid-template-columns:22px minmax(0,1fr);gap:14px;padding:14px 6px;border-bottom:1px solid var(--bd);width:100%;align-items:start}
.arow:hover{background:var(--hov)}
.at{display:flex;flex-direction:column;gap:3px}.at b{display:flex;align-items:center;gap:8px;font-size:15.5px;font-weight:700}.at>span{font-size:14px;line-height:1.45;color:var(--tx2)}
.chip{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:999px;border:1px solid var(--bd2);font-size:12px;font-weight:700;color:var(--tx2);white-space:nowrap;letter-spacing:0}
.chip.inv{background:var(--inv);color:var(--invtx);border-color:var(--inv)}
